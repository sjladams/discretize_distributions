[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discretize_distributions"
version = "2.1.0"
authors = [
    {name = "Steven Adams"}
]
description = "Signatures of Probability Distributions"
readme = "README.md"
requires-python = ">=3.9.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=1.13.1",
    "torch-kmeans>=0.2.0",
    "xitorch>=0.3.0",
    "stable-trunc-gaussian>=1.3.9",
]

[project.optional-dependencies]
examples = ["matplotlib"]
dev = ["tqdm"]

[project.urls]
Homepage = "https://github.com/sjladams/discretize_distributions"
"Bug Tracker" = "https://github.com/sjladams/discretize_distributions/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discretize_distributions = ["data/*.pickle"]
